name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks-and-artifact:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks-and-artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: scamshop-detector-${{ github.sha }}
          path: dist
      - name: Verify tag and archive
        shell: bash
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version." >&2
            exit 1
          fi
          expected="scamshop-detector-v${version}.zip"
          shopt -s nullglob
          archives=(dist/scamshop-detector-v*.zip)
          if [[ ${#archives[@]} -ne 1 || "${archives[0]##*/}" != "$expected" ]]; then
            echo "Expected exactly dist/$expected in the CI artifact." >&2
            exit 1
          fi
          (cd dist && sha256sum "$expected" > "$expected.sha256")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/scamshop-detector-v${RELEASE_VERSION}.zip" "dist/scamshop-detector-v${RELEASE_VERSION}.zip.sha256" --verify-tag --title "ScamShop Detector ${RELEASE_VERSION}" --notes-file .github/release-notes.txt
