name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  browser-and-package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:browser -- --with-deps
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: scamshop-detector-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
